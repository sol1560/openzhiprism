<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知棱 · 聊天捕捉</title><link rel="stylesheet" href="options.css"></head>
<body><main>
  <header><img src="icons/128.png" width="40" height="40" alt=""><span>知棱 <small>ZhiPrism</small></span><a data-path="/profile" target="_blank" rel="noopener noreferrer">打开知棱 ↗</a></header>
  <h1>让这段聊天，<br>成为下一次发现。</h1>
  <p class="intro">在 ChatGPT 或 Claude 中点击知棱图标，当前聊天就会进入你的兴趣画像。</p>
  <section aria-labelledby="account-heading"><h2 id="account-heading">连接账户</h2><p id="account">正在读取…</p><div class="actions"><button data-action="connect">连接知棱</button><button class="secondary" data-action="disconnect" hidden>断开连接</button></div><p class="note">只在你点击时捕捉。文字、代码和链接会发送到知棱，脱敏后保存并分析；图片及附件只记录名称。</p><p id="error" role="alert"></p></section>
  <section aria-labelledby="recent-heading"><h2 id="recent-heading">最近捕捉</h2><ul id="tasks"></ul></section>
  <footer>在浏览器扩展菜单中固定知棱，之后点一下就能导入。<a data-path="/extension" target="_blank" rel="noopener noreferrer">安装与使用帮助 ↗</a></footer>
</main><script src="options.js"></script></body></html>
